name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/01a10442-custom-keyboard'

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout keyboard source branch
        uses: actions/checkout@v4
        with:
          # El workflow puede estar en main para que aparezca en GitHub Actions,
          # pero el proyecto Android está en esta rama de Arena.
          ref: arena/01a10442-custom-keyboard

      - name: Verify Android project exists
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare downloadable APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ArenaCustomKeyboard-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaCustomKeyboard-debug-apk
          path: artifacts/ArenaCustomKeyboard-debug.apk
          if-no-files-found: error
          retention-days: 30
