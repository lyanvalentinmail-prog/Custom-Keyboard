name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/01a10442-custom-keyboard'

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout keyboard source branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a10442-custom-keyboard

      - name: Verify Android project exists
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK manually
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_ZIP="$RUNNER_TEMP/android-commandline-tools.zip"
          CMDLINE_DIR="$RUNNER_TEMP/android-commandline-tools"

          rm -rf "$SDK_ROOT" "$CMDLINE_DIR" "$CMDLINE_ZIP"
          mkdir -p "$SDK_ROOT/cmdline-tools" "$CMDLINE_DIR"

          echo "Downloading Android command line tools..."
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$CMDLINE_ZIP"
          unzip -q "$CMDLINE_ZIP" -d "$CMDLINE_DIR"
          mv "$CMDLINE_DIR/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "sdk.dir=$SDK_ROOT" > local.properties
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle-8.10.2-bin.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.10.2/bin/gradle --version

      - name: Build debug APK
        shell: bash
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare downloadable APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ArenaCustomKeyboard-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaCustomKeyboard-debug-apk
          path: artifacts/ArenaCustomKeyboard-debug.apk
          if-no-files-found: error
          retention-days: 30
